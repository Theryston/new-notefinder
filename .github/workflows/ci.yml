name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Lint
        run: nub run lint

      - name: Type check
        run: nub run check-types

      # Runs the unit tests and fails when coverage drops below the
      # thresholds in each app's vitest.config.ts.
      - name: Test (with coverage)
        run: nub run test:cov

      - name: Build
        run: nub run build

      # Fails when the Drizzle schema changed without a migration (or the
      # migrations are inconsistent). Nothing connects to a database: the
      # example env only satisfies the env schema drizzle.config.ts parses.
      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          cp .env.example .env
          nub exec drizzle-kit check
          nub exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::The Drizzle schema has changes with no migration. Run 'nub run db:generate' in apps/api and commit the result."
            exit 1
          fi

  # The API is a public contract (the mobile app will depend on it): fail when
  # the committed openapi.json has a breaking change against the base branch.
  # The e2e suite keeps openapi.json in sync with the code.
  api-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No breaking changes in the API contract
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF:apps/api/openapi.json"
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "The base branch has no apps/api/openapi.json yet: nothing to compare."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/openapi"
          git show "$base" > "$RUNNER_TEMP/openapi/base.json"
          cp apps/api/openapi.json "$RUNNER_TEMP/openapi/head.json"
          docker run --rm -v "$RUNNER_TEMP/openapi:/specs" tufin/oasdiff:v1.32.1 \
            breaking /specs/base.json /specs/head.json --fail-on ERR

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Chromium matching the installed @playwright/test version, plus the
      # system libraries it needs on the runner.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: nub exec playwright install --with-deps chromium

      # Builds what each suite needs (web runs against a production build),
      # then runs the API e2e tests and the web Playwright suite. The API
      # suite starts its own Postgres with Testcontainers on the runner's
      # Docker (no `services:` block; see apps/api/test/setup/global-setup.ts).
      - name: E2E tests
        run: nub run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
