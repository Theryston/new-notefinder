name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Lint
        run: nub run lint

      - name: Type check
        run: nub run check-types

      - name: Test
        run: nub run test

      - name: Build
        run: nub run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Chromium matching the installed @playwright/test version, plus the
      # system libraries it needs on the runner.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: nub exec playwright install --with-deps chromium

      # Builds what each suite needs (web runs against a production build),
      # then runs the API e2e tests and the web Playwright suite.
      - name: E2E tests
        run: nub run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
