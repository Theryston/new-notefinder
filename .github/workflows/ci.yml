name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Lint
        run: nub run lint

      - name: Type check
        run: nub run check-types

      # Runs the unit tests and fails when coverage drops below the
      # thresholds in each app's vitest.config.ts.
      - name: Test (with coverage)
        run: nub run test:cov

      - name: Build
        run: nub run build

      # First-load JS of every prerendered page against the budget in
      # apps/web/scripts/bundle-budget.ts (needs the build above).
      - name: Web bundle budget
        working-directory: apps/web
        run: nub run bundle:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.5

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Chromium matching the installed @playwright/test version, plus the
      # system libraries it needs on the runner.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: nub exec playwright install --with-deps chromium

      # Builds what each suite needs (web runs against a production build),
      # then runs the API e2e tests and the web Playwright suite. The API
      # suite starts its own Postgres with Testcontainers on the runner's
      # Docker (no `services:` block; see apps/api/test/setup/global-setup.ts).
      - name: E2E tests
        run: nub run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
