name: Music catalog mbslave bump

# MusicBrainz changes its database schema about once a year, and replication
# stops until mbslave is upgraded (apps/music-catalog/CLAUDE.md "Yearly
# schema change"). This job watches mbslave releases and opens a PR bumping
# the pinned version; CI runs the music-catalog e2e suite against the new
# schema on that PR, and the maintainer merges it and redeploys.
on:
  schedule:
    # Monday mornings: mbslave releases a few times a year, so weekly is
    # plenty, and a weekday keeps the e2e failures (if any) visible.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: music-catalog-mbslave-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(sed -n "s/^ARG MBSLAVE_REF=\(v[0-9.]*\)$/\1/p" apps/music-catalog/mbslave.Dockerfile)"
          if [ -z "$pinned" ]; then
            echo "::error::Could not read MBSLAVE_REF from apps/music-catalog/mbslave.Dockerfile"
            exit 1
          fi
          # Tags, not releases: mbslave publishes version tags without
          # GitHub releases, so `releases/latest` would 404. The list mixes
          # ancient date-based tags with the schema-numbered ones, so the
          # year-like majors are excluded before the version sort.
          latest="$(gh api repos/acoustid/mbslave/tags --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Ev '^v(19|20)[0-9]{2}\.' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::Could not list mbslave tags"
            exit 1
          fi
          echo "Pinned mbslave: $pinned, latest tag: $latest"
          highest="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$highest" = "$pinned" ]; then
            echo "The pinned mbslave is current: nothing to do."
            exit 0
          fi
          branch="ci/mbslave-bump-$latest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout "$branch"
            push="git push --force-with-lease origin $branch"
          else
            git checkout -b "$branch"
            push="git push origin $branch"
          fi
          sed -i "s/^ARG MBSLAVE_REF=${pinned}$/ARG MBSLAVE_REF=${latest}/" apps/music-catalog/mbslave.Dockerfile
          sed -i "s/^# MBSLAVE_REF=${pinned}$/# MBSLAVE_REF=${latest}/" apps/music-catalog/.env.example
          sed -i "s/^const MBSLAVE_REF = '${pinned}';$/const MBSLAVE_REF = '${latest}';/" apps/music-catalog/test/setup/musicbrainz-schema.ts
          if git diff --quiet; then
            echo "The branch already pins $latest: nothing to do."
            exit 0
          fi
          git add apps/music-catalog/mbslave.Dockerfile apps/music-catalog/.env.example apps/music-catalog/test/setup/musicbrainz-schema.ts
          git commit -m "chore(music-catalog): bump mbslave to $latest"
          $push
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Updated the open bump PR."
            exit 0
          fi
          gh pr create \
            --head "$branch" \
            --base main \
            --title "chore(music-catalog): bump mbslave to $latest" \
            --body "MusicBrainz's yearly schema change (issue #69): CI proposes the mbslave upgrade. CI runs the music-catalog e2e suite against the new schema on this PR. When it is green, merge it and run \`docker compose pull && docker compose up -d\` on the server (procedure in apps/music-catalog/CLAUDE.md)."
