# https://lefthook.dev/configuration/
pre-commit:
  jobs:
    - name: biome
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}'
      run: nub exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -n1 {1} | grep -Eq '^(Merge |Revert )|^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\((web|api|music-catalog|contracts|repo|nfp-audio)\))?!?: .+' || {
          echo 'Commit message must follow Conventional Commits: <type>(<scope>): <subject>'
          echo 'Types: feat fix refactor perf test docs build ci chore style revert'
          echo 'Scopes: web api music-catalog contracts repo nfp-audio'
          exit 1
        }
