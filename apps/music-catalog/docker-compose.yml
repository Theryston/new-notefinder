# The Music catalog service's own Postgres, separate from the API's (host
# port 5433, the API's uses 5432). Included by the root docker-compose.yml, so
# `nub run infra:up` / `infra:down` manage it with the rest of the stack.
# Meilisearch, the search engine (chosen after the benchmark in issue #68),
# joins it below, and so does mbslave, which owns the first import (issue
# #60): on start it restores the MusicBrainz dump, then exits.
services:
  music-catalog-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: music_catalog
      POSTGRES_PASSWORD: music_catalog
      POSTGRES_DB: music_catalog
    ports:
      - '5433:5432'
    volumes:
      - music-catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U music_catalog -d music_catalog']
      interval: 5s
      timeout: 5s
      retries: 10


  # The search engine. Pinned to a stable v1.x (the benchmark used v1.54.2);
  # keep the tag in sync with apps/music-catalog/test/setup/meilisearch.ts.
  # With a master key it refuses requests without a valid API key, like in
  # production.
  music-catalog-meilisearch:
    image: getmeili/meilisearch:v1.54.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: local-dev-meilisearch-master-key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - music-catalog-meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the two keys the service uses, with fixed uids (a
  # key is derived from its uid and the master key, so they are the same on
  # every machine and .env.example can list them): the server's can only
  # search, the worker's can manage indexes, settings and documents.
  # Idempotent (HTTP 409 means the key is already there), so it is safe on
  # every `infra:up`.
  music-catalog-meilisearch-init:
    image: getmeili/meilisearch:v1.54.2
    restart: 'no'
    depends_on:
      music-catalog-meilisearch:
        condition: service_healthy
    environment:
      MEILI_MASTER_KEY: local-dev-meilisearch-master-key
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        create_key() {
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://music-catalog-meilisearch:7700/keys \
            -H "Authorization: Bearer $$MEILI_MASTER_KEY" -H 'Content-Type: application/json' -d "$$1")
          [ "$$code" = 201 ] || [ "$$code" = 409 ] || { echo "Could not create a key (HTTP $$code)"; exit 1; }
        }
        create_key '{"uid":"5ea2c4a1-0000-4000-8000-000000000001","name":"music-catalog-search","actions":["search"],"indexes":["recordings","lyrics"],"expiresAt":null}' &&
        create_key '{"uid":"5ea2c4a1-0000-4000-8000-000000000002","name":"music-catalog-write","actions":["documents.*","indexes.*","settings.*","tasks.get"],"indexes":["*"],"expiresAt":null}'

  # The first import and continuous replication (issues #60 and #62). On
  # start it checks the bootstrap state, restores the MusicBrainz dump with
  # `mbslave init --empty` + `mbslave import` when needed (skipping when
  # already done, redoing from a clean state when interrupted) and records
  # `restored`. The worker takes it from there to `ready`. In `full` mode it
  # then replicates continuously: once the catalog is `ready` it applies the
  # pending packets with `mbslave sync`, records the sequence and sleeps,
  # until stopped; in `tiny` mode it exits instead. A crash exits non-zero,
  # so the restart below brings the loop back (it resumes from mbslave's own
  # cursor). `infra:down` removes the container, so every `infra:up`
  # re-checks the state (a no-op when done). Re-run it without touching
  # anything else with
  # `docker compose up --force-recreate music-catalog-mbslave`.
  music-catalog-mbslave:
    build:
      # The repository root: the image only copies manifests and sources, and
      # the container runs the compiled restore from a read-only mount below.
      context: ../..
      dockerfile: apps/music-catalog/mbslave.Dockerfile
    # Rebuild the image on `up` when the Dockerfile changed (cached otherwise).
    pull_policy: build
    # Restarts after a crash (a failed restore is redone from `restoring`, a
    # failed sync resumed from the cursor), never after a clean exit (the
    # `tiny` container stays stopped once it is done).
    restart: on-failure
    depends_on:
      music-catalog-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # The same database the server and the worker use, reached by service
      # name inside the compose network (not the host's localhost:5433).
      DATABASE_URL: postgres://music_catalog:music_catalog@music-catalog-postgres:5432/music_catalog
      CATALOG_DATASET: ${CATALOG_DATASET:-tiny}
      MUSICBRAINZ_DUMP_BASE_URL: ${MUSICBRAINZ_DUMP_BASE_URL:-https://data.metabrainz.org/pub/musicbrainz/data}
      # The MetaBrainz access token replication authenticates with in `full`
      # mode (required there, ignored in `tiny`): the 40-character token
      # from the MetaBrainz profile page, free for non-commercial use. Either
      # the token itself or a file holding it (Docker secrets); empty when
      # unset, which the restore strips before spawning mbslave (an empty
      # `_FILE` path would make the binary crash opening it).
      MBSLAVE_MUSICBRAINZ_TOKEN: ${MBSLAVE_MUSICBRAINZ_TOKEN:-}
      MBSLAVE_MUSICBRAINZ_TOKEN_FILE: ${MBSLAVE_MUSICBRAINZ_TOKEN_FILE:-}
      # What the mbslave binary itself connects with. The dump download needs
      # no token; the database name comes from MBSLAVE_DB_DB (mbslave ignores
      # the README's MBSLAVE_DB_NAME). The dev database user is a superuser
      # (it owns the database), which `init --empty` needs for the contrib
      # extensions, so it doubles as the admin user here.
      MBSLAVE_DB_HOST: music-catalog-postgres
      MBSLAVE_DB_PORT: '5432'
      MBSLAVE_DB_DB: music_catalog
      MBSLAVE_DB_USER: music_catalog
      MBSLAVE_DB_PASSWORD: music_catalog
      MBSLAVE_DB_ADMIN_USER: music_catalog
      MBSLAVE_DB_ADMIN_PASSWORD: music_catalog
    volumes:
      # The compiled restore and its dependencies, built on the host with
      # `nub run build --filter=music-catalog` (the repo's own toolchain, so
      # the container never installs workspaces itself).
      - ../../:/repo:ro
      # mbslave downloads the dumps into its work directory: kept across
      # restarts, so an interrupted download resumes instead of starting over.
      - music-catalog-mbslave-data:/var/lib/mbslave

volumes:
  music-catalog-postgres-data:
  music-catalog-meilisearch-data:
  music-catalog-mbslave-data:
